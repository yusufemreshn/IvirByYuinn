# Gradle daemon'a bellek/kodlama ayarları veriyoruz, büyük projelerde sync'i rahatlatır
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX kütüphanelerini kullandığımızı belirtiyoruz (eski destek kütüphaneleri değil)
android.useAndroidX=true

# Her modül kendi R sınıfını üretsin, gereksiz yere başka modüllerin kaynaklarını görmesin
android.nonTransitiveRClass=true

# Kotlin'in resmi kod stiline göre biçimlendirme kuralları kullanılsın
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
